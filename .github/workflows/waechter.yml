# =====================================================================
#  Tagesbrief – Wächter: Morgen-Push und Eilmeldungen, etwa alle 15 Minuten
# =====================================================================
name: Wächter

on:
  schedule:
    # Nicht zur vollen Stunde – da ist GitHub am vollsten und verschiebt Läufe am stärksten
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Nur einen Test-Push an alle Geräte schicken"
        type: boolean
        default: false

permissions:
  contents: write # Eilmeldungen in data/state.json speichern
  pages: write
  id-token: write

concurrency:
  group: waechter
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Push-Werkzeug installieren
        run: pip install -q pywebpush

      - name: Wächter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ROUNDS: "1" # in 15 Minuten kommt der nächste Versuch
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          TEST_PUSH: ${{ inputs.test_push }}
        run: python pipeline/watch.py

      - name: Speichern
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Wächter $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
          # das Morgen-Briefing speichert evtl. gleichzeitig (andere Datei) → erst seinen Stand holen
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Webseite nur neu veröffentlichen, wenn sich etwas geändert hat
      - name: Webseite zusammenstellen
        if: steps.save.outputs.changed == 'true'
        run: |
          mkdir _site
          cp -r index.html app.js styles.css sw.js manifest.webmanifest icons data _site/
      - if: steps.save.outputs.changed == 'true'
        uses: actions/configure-pages@v6
      - if: steps.save.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        if: steps.save.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
