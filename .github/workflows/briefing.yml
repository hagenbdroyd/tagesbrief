# =====================================================================
#  Tagesbrief – jeden Morgen Briefing erstellen und Webseite veröffentlichen
# =====================================================================
name: Briefing

on:
  schedule:
    # GitHub rechnet in UTC: 04:23 UTC = 5:23 Uhr im Winter, 6:23 Uhr im Sommer.
    # Geplante Läufe starten oft ein paar Minuten später – das Briefing steht trotzdem vor 7 Uhr.
    - cron: "23 4 * * *"
  workflow_dispatch: # Knopf „Run workflow“ zum Testen
  push:
    branches: [main] # Änderungen an der App sofort veröffentlichen

permissions:
  contents: write # Briefing im Projekt speichern
  pages: write # Webseite veröffentlichen
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Briefing erstellen
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ROUNDS: "5" # morgens ist Zeit: länger auf die starken Modelle warten
          GEMINI_THINKING: medium # gründlicher als beim Testen am Mac, dauert etwas länger
        run: python3 pipeline/build.py

      - name: Briefing speichern
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefing.json
          git diff --cached --quiet || git commit -m "Briefing $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
          # der Wächter speichert evtl. gleichzeitig (andere Datei) → erst seinen Stand holen
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

      - name: Webseite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html app.js styles.css sw.js manifest.webmanifest icons data _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
